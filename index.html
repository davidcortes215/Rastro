<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rastro</title>
  <meta name="description" content="Registra, valora y filtra tus puntos de interés sobre un mapa: restaurantes, miradores, faros, acampadas y más.">
  <meta name="theme-color" content="#141414">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app">

    <!-- Barra superior -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2c-3.9 0-7 3.1-7 7 0 5 7 13 7 13s7-8 7-13c0-3.9-3.1-7-7-7z" fill="currentColor"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></svg>
        </span>
        <span class="brand-name" id="brand-name">Rastro</span>
      </div>

      <form class="geosearch" id="geosearch" role="search" autocomplete="off">
        <input type="search" id="geosearch-input" name="q"
               placeholder="Buscar un lugar para ir…" aria-label="Buscar un lugar en el mapa">
        <ul class="geosearch-results" id="geosearch-results" hidden></ul>
      </form>

      <div class="topbar-actions">
        <button type="button" class="btn btn--ghost" id="btn-locate" title="Centrar en mi ubicación" aria-label="Centrar en mi ubicación">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="btn btn--solid" id="btn-add" aria-pressed="false">
          <span class="btn-plus" aria-hidden="true">+</span> <span class="btn-add-text">Añadir</span>
        </button>
        <button type="button" class="btn btn--ghost btn--panel-toggle" id="btn-panel" title="Mostrar u ocultar el panel" aria-label="Mostrar u ocultar el panel">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <!-- Área principal -->
    <div class="workspace">

      <!-- Panel: filtros + lista -->
      <aside class="panel" id="panel" aria-label="Filtros y listado de puntos">
        <div class="panel-section">
          <label class="label" for="filter-text">Buscar en mis puntos</label>
          <input type="search" class="field-input" id="filter-text" placeholder="Nombre, nota, lugar…">
        </div>

        <div class="panel-section">
          <div class="panel-section-head">
            <span class="label">Categorías</span>
            <button type="button" class="linkbtn" id="cats-toggle-all">Todas</button>
          </div>
          <div class="chips" id="filter-cats" role="group" aria-label="Filtrar por categoría"></div>
        </div>

        <div class="panel-section panel-section--row">
          <div class="minirow">
            <label class="label" for="filter-rating">Valoración mín.</label>
            <select class="field-input" id="filter-rating">
              <option value="0">Todas</option>
              <option value="1">★ 1+</option>
              <option value="2">★ 2+</option>
              <option value="3">★ 3+</option>
              <option value="4">★ 4+</option>
              <option value="5">★ 5</option>
            </select>
          </div>
          <div class="minirow">
            <label class="label" for="filter-status">Estado</label>
            <select class="field-input" id="filter-status">
              <option value="todos">Todos</option>
            </select>
          </div>
        </div>

        <div class="panel-count">
          <span id="count-visible">0</span> de <span id="count-total">0</span> puntos
          <button type="button" class="linkbtn" id="btn-reset-filters" hidden>Limpiar filtros</button>
        </div>

        <ul class="poi-list" id="poi-list"></ul>

        <div class="panel-footer">
          <button type="button" class="linkbtn" id="btn-export">Exportar</button>
          <button type="button" class="linkbtn" id="btn-import">Importar</button>
          <input type="file" id="import-file" accept="application/json" hidden>
        </div>
      </aside>

      <!-- Mapa -->
      <div class="map-wrap">
        <div id="map"></div>
        <div class="map-hint" id="map-hint" hidden>
          <span>Toca el mapa donde quieras colocar el punto</span>
          <button type="button" class="linkbtn" id="btn-cancel-add">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Editor de punto -->
  <div class="editor-backdrop" id="editor-backdrop" hidden></div>
  <div class="editor" id="editor" role="dialog" aria-modal="true" aria-labelledby="editor-title" hidden>
    <form id="editor-form">
      <div class="editor-head">
        <h2 id="editor-title">Nuevo punto</h2>
        <button type="button" class="editor-close" id="editor-close" aria-label="Cerrar">&times;</button>
      </div>

      <div class="editor-body">
        <div class="field">
          <label class="label" for="poi-name">Nombre</label>
          <input type="text" class="field-input" id="poi-name" required maxlength="120" placeholder="Ej. Faro de Fisterra">
        </div>
        <div class="field">
          <label class="label" for="poi-cat">Categoría</label>
          <select class="field-input" id="poi-cat"></select>
        </div>
        <div class="field">
          <span class="label">Valoración</span>
          <div class="stars" id="poi-stars" role="radiogroup" aria-label="Valoración de 1 a 5 estrellas"></div>
        </div>
        <div class="field">
          <span class="label">Estado</span>
          <div class="toggle-group" id="poi-status" role="radiogroup" aria-label="Estado"></div>
        </div>
        <div class="field">
          <label class="label" for="poi-notes">Impresiones</label>
          <textarea class="field-input" id="poi-notes" rows="4" maxlength="2000" placeholder="¿Qué te pareció? Qué probaste, con quién fuiste, cuándo volver…"></textarea>
        </div>
        <p class="coords" id="poi-coords"></p>
      </div>

      <div class="editor-foot">
        <button type="button" class="btn btn--danger" id="poi-delete" hidden>Eliminar</button>
        <div class="editor-foot-right">
          <button type="button" class="btn btn--ghost" id="poi-cancel">Cancelar</button>
          <button type="submit" class="btn btn--solid">Guardar</button>
        </div>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
